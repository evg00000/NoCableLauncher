name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework compiler that ships with Windows
        shell: cmd
        run: call build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/NoCableLauncher/RS_ASIO -Force | Out-Null
          Copy-Item NoCableLauncher.exe, NCL_Settings.bat, NCL_RestoreAudio.bat, README.md, LICENSE, CHANGELOG.md dist/NoCableLauncher/
          Set-Content dist/NoCableLauncher/RS_ASIO/PUT_RS_ASIO_FILES_HERE.txt "avrt.dll, RS_ASIO.dll, RS_ASIO.ini from https://github.com/mdias/rs_asio/releases"
          Compress-Archive dist/NoCableLauncher/* dist/NoCableLauncher.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NoCableLauncher
          path: dist/NoCableLauncher.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NoCableLauncher.zip
          generate_release_notes: true
